
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노유나</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #29251f;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.notebook {
  position: relative;
  width: min(100vw, 928px);
  aspect-ratio: 928 / 1650;
  overflow: hidden;
  box-shadow: 0 8px 35px #0007;
}

.notebook img {
  width: 100%;
  height: 100%;
  display: block;
}

.writing {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  font-family: 'Nanum Pen Script', cursive;
  font-size: clamp(110px, 18vw, 175px);
  font-weight: 400;
  letter-spacing: 5px;
  color: rgba(255, 218, 25, 0.78);
  text-shadow: 0 0 1px rgba(255, 214, 0, 0.3);
  width: 0;
  overflow: hidden;
  animation: write 2.4s steps(35, end) forwards;
}

@keyframes write {
  from { width: 0; }
  to { width: 100%; }
}

button {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  border: none;
  border-radius: 30px;
  padding: 12px 23px;
  background: #f3d84c;
  color: #40391f;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="notebook">
  <img src="IMG_1860.jpeg" alt="공책">
  <div class="writing" id="writing">노유나</div>
</div>

<button onclick="replay()">다시 쓰기</button>

<script>
function replay() {
  const writing = document.getElementById("writing");
  writing.style.animation = "none";
  void writing.offsetWidth;
  writing.style.animation = "write 2.4s steps(35, end) forwards";
}
</script>

</body>
</html>
