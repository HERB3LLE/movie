
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노유나</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at center, #55534c, #24231f);
  overflow: hidden;
  font-family: sans-serif;
}

.scene {
  width: min(92vw, 580px);
  perspective: 1000px;
}

.notebook {
  position: relative;
  width: 100%;
  min-height: 360px;
  padding: 70px 28px 65px 72px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 34px,
      rgba(105,155,194,.24) 35px,
      transparent 36px
    ),
    linear-gradient(110deg, #f5f0df, #fffdf2 45%, #f1ead8);
  border-radius: 3px 9px 9px 3px;
  box-shadow:
    0 24px 45px rgba(0,0,0,.4),
    inset 5px 0 10px rgba(0,0,0,.12),
    inset -3px 0 5px rgba(0,0,0,.06);
  transform: rotate(-1deg);
  overflow: hidden;
}

/* 종이 질감 */
.notebook::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .19;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}

/* 세로 여백선 */
.margin-line {
  position: absolute;
  left: 55px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(198,105,91,.45);
}

/* 공책 스프링 */
.spiral {
  position: absolute;
  left: 13px;
  top: 0;
  bottom: 0;
  width: 28px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      #777 28px,
      #dedede 30px,
      #777 32px,
      transparent 34px
    );
  z-index: 3;
}

.holes {
  position: absolute;
  left: 43px;
  top: 0;
  bottom: 0;
  width: 12px;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      #b7ae9b 28px,
      #b7ae9b 35px,
      transparent 36px
    );
  opacity: .7;
}

/* 글씨 */
.writing-area {
  position: relative;
  margin-top: 70px;
  width: 100%;
  height: 90px;
  display: flex;
  align-items: center;
}

.highlight {
  position: absolute;
  left: -4px;
  top: 15px;
  height: 47px;
  width: 0;
  background: rgba(255, 225, 35, .67);
  border-radius: 5px 2px 4px 3px;
  transform: rotate(-1.2deg);
  filter: blur(.5px);
  transition: width 2.1s ease;
}

.highlight::after {
  content: "";
  position: absolute;
  inset: 3px 0;
  background: rgba(255, 244, 75, .23);
  transform: rotate(.5deg);
}

.word {
  position: relative;
  z-index: 2;
  font-family: 'Nanum Pen Script', cursive;
  font-size: clamp(58px, 13vw, 83px);
  color: #26251f;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  line-height: 1.3;
  text-shadow: .3px .3px .3px rgba(0,0,0,.25);
}

.pen {
  position: absolute;
  z-index: 5;
  top: 14px;
  left: 0;
  font-size: 27px;
  opacity: 0;
  transform: rotate(-35deg);
  transition: left 2.1s linear;
}

.notebook.playing .highlight {
  width: 235px;
}

.notebook.playing .word {
  animation: writing 2.4s steps(4, end) forwards;
  animation-delay: 1.5s;
}

.notebook.playing .pen {
  opacity: 1;
  animation: penMove 2.4s linear forwards;
  animation-delay: 1.5s;
}

@keyframes writing {
  to { width: 245px; }
}

@keyframes penMove {
  from { left: 0; }
  to { left: 235px; }
}

.corner {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 35px;
  height: 35px;
  background: linear-gradient(135deg, #e8dfcb 50%, #c9bea9 51%);
  box-shadow: -2px -2px 4px rgba(0,0,0,.08);
}

.controls {
  margin-top: 34px;
  text-align: center;
}

button {
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 30px;
  background: rgba(30,30,30,.65);
  color: white;
  padding: 11px 25px;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="scene">
  <div class="notebook" id="notebook">
    <div class="spiral"></div>
    <div class="holes"></div>
    <div class="margin-line"></div>

    <div class="writing-area">
      <div class="highlight"></div>
      <div class="word">노유나</div>
      <div class="pen">✎</div>
    </div>

    <div class="corner"></div>
  </div>

  <div class="controls">
    <button onclick="replay()">다시 쓰기</button>
  </div>
</div>

<script>
const notebook = document.getElementById('notebook');

function replay() {
  notebook.classList.remove('playing');
  void notebook.offsetWidth;

  setTimeout(() => {
    notebook.classList.add('playing');
  }, 100);
}

window.onload = replay;
</script>

</body>
</html>
