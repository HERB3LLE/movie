<style>
*{box-sizing:border-box}
body{margin:0;background:#100b19;color:white;font-family:Arial,"Apple SD Gothic Neo",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}

<script type="module">
import * as THREE from "three";

const SUPABASE_URL="https://jaedeuxeiqpphpjaxgiv.supabase.co";
const SUPABASE_KEY="sb_publishable_SSHP4r2Ge7BACfUyfx700Q_Z5OvbZIa";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();

let scene,camera,renderer;
let player=new THREE.Vector3(0,1.7,12);
let yaw=0,pitch=0,seated=false,currentSeat=null,nearbySeat=null;
let seatObjects={},presenceChannel=null,audience={};
let films=[],isAdmin=false,currentUser=null;
let heartCount=0,keys={},touchMove={},lookPointer=null,lastX=0,lastY=0,lastFrame=0;
let screenMesh;

function notice(message){
  const el=$("notice");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>el.classList.remove("show"),2300);
}

function mat(color,extra={}){
  return new THREE.MeshStandardMaterial({color,roughness:.8,...extra});
}

function box(w,h,d,color,x,y,z,extra={}){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,extra));
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

/* 영화관 공간 */
function createWorld(){
  const root=$("world");
  scene=new THREE.Scene();
  scene.background=new THREE.Color("#09070c");
  scene.fog=new THREE.Fog("#09070c",23,48);

  camera=new THREE.PerspectiveCamera(72,root.clientWidth/root.clientHeight,.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(root.clientWidth,root.clientHeight);
  renderer.shadowMap.enabled=true;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  root.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight("#e3d6ed","#251522",1.8));

  const front=new THREE.PointLight("#fff0e6",100,35);
  front.position.set(0,9,-10);
  scene.add(front);

  for(const x of [-12,12]){
    const light=new THREE.PointLight("#dca0cf",38,24);
    light.position.set(x,5,0);
    scene.add(light);
  }

  // 공간 크기
  box(28,.4,34,"#242127",0,-.2,0);
  box(28,.5,34,"#17141c",0,10.5,0);
  box(.5,11,34,"#343039",-14,5,0);
  box(.5,11,34,"#343039",14,5,0);
  box(28,11,.5,"#201b25",0,5,16.5);
  box(28,11,.5,"#211b25",0,5,-16.5);

  // 무대와 대형 스크린
  box(21,.7,2.2,"#17141b",0,.1,-13.8);
  box(22,.35,.6,"#09080c",0,.65,-13.3);

  // 스크린 프레임
  box(21.5,.25,.35,"#b2a5ad",0,10.1,-15.8);
  box(21.5,.25,.35,"#b2a5ad",0,.9,-15.8);
  box(.25,9.2,.35,"#b2a5ad",-10.75,5.5,-15.8);
  box(.25,9.2,.35,"#b2a5ad",10.75,5.5,-15.8);

  screenMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(20.8,8.9),
    new THREE.MeshBasicMaterial({color:"#e7e3e7"})
  );
  screenMesh.position.set(0,5.5,-15.58);
  scene.add(screenMesh);

  // 양옆 검은 커튼
  for(const x of [-11.3,11.3]){
    const curtain=box(1.1,9.4,.25,"#08070a",x,5.5,-15.3);
    curtain.material.roughness=1;
  }

  // 무대 측면 스피커
  for(const x of [-12.4,12.4]){
    box(1.5,3,.9,"#09090c",x,5,-14.6);
    box(1.1,1.1,.12,"#252329",x,5.4,-14.05);
    box(.8,.8,.12,"#111116",x,4.2,-14.05);
  }

  // 천장 조명
  for(let z=-14;z<=12;z+=3.5){
    for(let x=-11;x<=11;x+=4.5){
      const lamp=box(.17,.09,.35,"#f5e6df",x,10.15,z,{emissive:"#f6d6cf",emissiveIntensity:1.4});
      const glow=new THREE.PointLight("#e8d1dc",5,5);
      glow.position.set(x,9.7,z);
      scene.add(glow);
    }
  }

  // 벽면 세로 조명 패널
  for(let z=-12;z<=13;z+=4){
    for(const x of [-13.65,13.65]){
      box(.1,5,.14,"#e4b5d5",x,5,z,{emissive:"#b66ca3",emissiveIntensity:1.1});
      const glow=new THREE.PointLight("#e2a4d2",8,5);
      glow.position.set(x+(x<0?.4:-.4),5,z);
      scene.add(glow);
    }
  }

  // 중앙 계단 통로
  box(2.2,.04,23,"#39333b",0,.02,-.1);
  for(let z=-9;z<=8;z+=1.5){
    box(2.1,.035,.09,"#d88ac8",0,.06,z,{emissive:"#d75db9",emissiveIntensity:1.3});
  }

  createSeats();
  camera.position.copy(player);
  camera.rotation.order="YXZ";
  updateCamera();

  window.addEventListener("resize",resizeWorld);
  renderer.domElement.addEventListener("pointerdown",lookStart);
  renderer.domElement.addEventListener("pointermove",lookMove);
  renderer.domElement.addEventListener("pointerup",lookEnd);
  renderer.domElement.addEventListener("pointercancel",lookEnd);

  animate();
}

/* 88개 좌석 */
function createSeats(){
  for(let row=0;row<8;row++){
    for(let col=0;col<11;col++){
      const group=new THREE.Group();
      const id=`${String(row+1).padStart(2,"0")}-${String(col+1).padStart(2,"0")}`;

      const red=mat("#701b2d");
      const redBack=mat("#8c2439");
      const dark=mat("#17151a");

      const cushion=new THREE.Mesh(new THREE.BoxGeometry(.95,.22,.9),red);
      cushion.position.set(0,.8,.05);
      group.add(cushion);

      const back=new THREE.Mesh(new THREE.BoxGeometry(.95,1.25,.22),redBack);
      back.position.set(0,1.42,-.34);
      group.add(back);

      for(const x of [-.54,.54]){
        const arm=new THREE.Mesh(new THREE.BoxGeometry(.13,.3,.95),dark);
        arm.position.set(x,.86,.03);
        group.add(arm);
      }

      for(const x of [-.37,.37]){
        for(const z of [-.25,.3]){
          const leg=new THREE.Mesh(new THREE.BoxGeometry(.11,.55,.11),dark);
          leg.position.set(x,.35,z);
          group.add(leg);
        }
      }

      // 중앙 통로 간격
      let x=(col-5)*1.65;
      if(col>=5)x+=.85;

      const z=7-row*1.9;
      group.position.set(x,0,z);
      group.userData.seatId=id;
      scene.add(group);
      seatObjects[id]=group;
    }
  }
}

/* 카메라와 화면 위치 */
function updateCamera(){
  camera.position.copy(player);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

/*
  실제 스크린의 3D 좌표를 화면 좌표로 변환해
  YouTube iframe을 스크린 위에 겹쳐 표시
*/
function updateScreenVideo(){
  const iframe=$("screenVideo");
  if(iframe.style.display==="none")return;

  const width=renderer.domElement.clientWidth;
  const height=renderer.domElement.clientHeight;

  const corners=[
    new THREE.Vector3(-10.4,9.95,-15.55),
    new THREE.Vector3(10.4,9.95,-15.55),
    new THREE.Vector3(10.4,1.05,-15.55),
    new THREE.Vector3(-10.4,1.05,-15.55)
  ];

  const projected=corners.map(v=>{
    const p=v.project(camera);
    return {
      x:(p.x+1)*width/2,
      y:(1-p.y)*height/2,
      z:p.z
    };
  });

  if(projected.some(p=>p.z>1)){
    iframe.style.display="none";
    return;
  }

  const minX=Math.min(...projected.map(p=>p.x));
  const maxX=Math.max(...projected.map(p=>p.x));
  const minY=Math.min(...projected.map(p=>p.y));
  const maxY=Math.max(...projected.map(p=>p.y));

  iframe.style.left=`${Math.max(0,minX)}px`;
  iframe.style.top=`${Math.max(0,minY)}px`;
  iframe.style.width=`${Math.max(0,Math.min(width,maxX)-Math.max(0,minX))}px`;
  iframe.style.height=`${Math.max(0,Math.min(height,maxY)-Math.max(0,minY))}px`;
  iframe.style.display="block";
}

function resizeWorld(){
  if(!renderer)return;
  const root=$("world");
  camera.aspect=root.clientWidth/root.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(root.clientWidth,root.clientHeight);
}

function animate(time=0){
  requestAnimationFrame(animate);
  const dt=Math.min((time-lastFrame)/1000,.05);
  lastFrame=time;
  if(!seated)movePlayer(dt);
  updateNearbySeat();
  updateCamera();
  updateScreenVideo();
  renderer.render(scene,camera);
}

/* 이동 */
function movePlayer(dt){
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp||touchMove.forward)f++;
  if(keys.KeyS||keys.ArrowDown||touchMove.backward)f--;
  if(keys.KeyA||touchMove.left)s--;
  if(keys.KeyD||touchMove.right)s++;

  if(!f&&!s)return;

  const speed=touchMove.run?5:3.5;
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=forward.multiplyScalar(f).add(right.multiplyScalar(s)).normalize();

  player.x=THREE.MathUtils.clamp(player.x+move.x*speed*dt,-12.5,12.5);
  player.z=THREE.MathUtils.clamp(player.z+move.z*speed*dt,-15,15);
}

window.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.code]=false);

function lookStart(e){
  if(e.target.closest("button")||e.target=== $("screenVideo"))return;
  lookPointer=e.pointerId;
  lastX=e.clientX;
  lastY=e.clientY;
}
function lookMove(e){
  if(lookPointer!==e.pointerId)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  yaw-=dx*.004;
  pitch=THREE.MathUtils.clamp(pitch-dy*.003,-.85,.85);
}
function lookEnd(){lookPointer=null;}

document.querySelectorAll("[data-move]").forEach(btn=>{
  const action=btn.dataset.move;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    touchMove[action]=true;
    btn.setPointerCapture(e.pointerId);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
    btn.addEventListener(ev,()=>touchMove[action]=false);
  });
});

document.querySelectorAll("[data-look]").forEach(btn=>{
  let timer;
  const dir=btn.dataset.look==="left"?-1:1;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    timer=setInterval(()=>yaw+=dir*.05,30);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
    btn.addEventListener(ev,()=>clearInterval(timer));
  });
});

/* 좌석 가까이 가기 */
function updateNearbySeat(){
  if(seated){
    $("sitBtn").style.display="none";
    $("leaveBtn").style.display="block";
    $("hint").style.display="none";
    return;
  }

  $("leaveBtn").style.display="none";
  let nearest=null,dist=1.8;

  for(const [id,group] of Object.entries(seatObjects)){
    const d=Math.hypot(player.x-group.position.x,player.z-group.position.z);
    if(d<dist){dist=d;nearest=id;}
  }

  nearbySeat=nearest;

  if(!nearest){
    $("sitBtn").style.display="none";
    $("hint").style.display="none";
    return;
  }

  const owner=audience[nearest];
  if(owner&&owner!==sessionId){
    $("sitBtn").style.display="none";
    $("hint").textContent="다른 관객이 앉아 있는 좌석이에요.";
    $("hint").style.display="block";
  }else{
    $("sitBtn").style.display="block";
    $("sitBtn").textContent=`이 좌석에 앉기 (${nearest})`;
    $("hint").textContent="좌석에 가까이 왔어요.";
    $("hint").style.display="block";
  }
}

$("sitBtn").addEventListener("click",async()=>{
  if(!nearbySeat)return;
  if(audience[nearbySeat]&&audience[nearbySeat]!==sessionId){
    notice("이미 다른 관객이 앉아 있어요.");
    return;
  }

  currentSeat=nearbySeat;
  const group=seatObjects[currentSeat];
  player.set(group.position.x,1.25,group.position.z+1.45);
  yaw=0;
  pitch=0;
  seated=true;
  await publishPresence();
  refreshSeats();
  notice(`${currentSeat} 좌석에 앉았어요.`);
});

$("leaveBtn").addEventListener("click",async()=>{
  if(!seated)return;
  const group=seatObjects[currentSeat];
  player.set(group.position.x,1.7,group.position.z+2.2);
  currentSeat=null;
  seated=false;
  await publishPresence();
  refreshSeats();
  notice("자리에서 일어났어요.");
});

/* 좌석 색상 */
function refreshSeats(){
  for(const [id,group] of Object.entries(seatObjects)){
    const owner=audience[id];
    const c=owner===sessionId?"#bd7db4":owner?"#e7b5df":"#701b2d";
    const b=owner===sessionId?"#e2a5d5":owner?"#b76ba8":"#8c2439";
    group.children[0].material.color.set(c);
    group.children[1].material.color.set(b);
  }
}

/* 실시간 접속 및 좌석 공유 */
async function startRealtime(){
  presenceChannel=supabase.channel("nyajju-cinema-live",{
    config:{presence:{key:sessionId},broadcast:{self:true}}
  });

  presenceChannel
    .on("presence",{event:"sync"},rebuildAudience)
    .on("broadcast",{event:"heart"},({payload})=>{
      if(payload?.from!==sessionId){
        heartCount++;
        $("heartCount").textContent=heartCount;
        notice("누군가 하트를 보냈어요 ♥");
      }
    })
    .subscribe(async status=>{
      if(status==="SUBSCRIBED")await publishPresence();
    });
}

async function publishPresence(){
  if(!presenceChannel)return;
  try{await presenceChannel.track({seat:currentSeat});}
  catch(e){console.error(e);}
}

function rebuildAudience(){
  const state=presenceChannel.presenceState();
  const next={};
  let count=0;
  for(const [key,entries] of Object.entries(state)){
    if(!entries?.length)continue;
    count++;
    const entry=entries[entries.length-1];
    if(entry.seat)next[entry.seat]=key;
  }
  audience=next;
  $("audience").textContent=`접속자 ${count}명`;
  refreshSeats();
}

/* 하트 */
$("heartBtn").addEventListener("click",async()=>{
  heartCount++;
  $("heartCount").textContent=heartCount;
  if(presenceChannel){
    await presenceChannel.send({
      type:"broadcast",event:"heart",payload:{from:sessionId}
    });
  }
  notice("하트를 보냈어요 ♥");
});

/* 영상 목록 */
async function loadFilms(){
  const {data,error}=await supabase.from("films").select("*").order("created_at",{ascending:false});
  if(error){
    console.error(error);
    $("filmList").innerHTML='<p class="sub">작품을 불러오지 못했어요.</p>';
    return;
  }
  films=data||[];
  renderFilms();
}

function renderFilms(){
  const list=$("filmList");
  list.innerHTML="";
  if(!films.length){
    list.innerHTML='<p class="sub">등록된 작품이 없어요.</p>';
    return;
  }

  for(const film of films){
    const card=document.createElement("article");
    card.className="card";
    const poster=document.createElement("div");
    poster.className="poster";

    if(film.poster_url){
      const img=document.createElement("img");
      img.src=film.poster_url;
      img.alt=film.title||"포스터";
      poster.appendChild(img);
      img.onerror=()=>poster.textContent="NO IMAGE";
    }else poster.textContent="NYAJJU CINEMA";

    const info=document.createElement("div");
    info.className="film-info";
    const title=document.createElement("div");
    title.className="film-title";
    title.textContent=film.title||"제목 없음";
    const type=document.createElement("div");
    type.className="film-type";
    type.textContent=film.type||"기타";

    const actions=document.createElement("div");
    actions.className="film-actions";
    const play=document.createElement("button");
    play.textContent="스크린에서 재생";
    play.onclick=()=>playFilm(film);
    actions.appendChild(play);

    if(isAdmin){
      const del=document.createElement("button");
      del.className="del";
      del.textContent="삭제";
      del.onclick=()=>deleteFilm(film.id);
      actions.appendChild(del);
    }

    info.append(title,type,actions);
    card.append(poster,info);
    list.appendChild(card);
  }
}

function getYoutubeId(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);
    if(u.searchParams.get("v"))return u.searchParams.get("v");
    const parts=u.pathname.split("/");
    const i=parts.findIndex(x=>x==="embed"||x==="shorts");
    return i>=0?parts[i+1]:null;
  }catch(e){return null;}
}

function playFilm(film){
  $("filmsPanel").classList.remove("show");

  const url=film.video_url||"";
  if(film.type==="Weverse"||url.includes("weverse.io")){
    notice("위버스는 외부 재생 제한 때문에 새 창으로 열게요.");
    window.open(url,"_blank","noopener,noreferrer");
    return;
  }

  const id=getYoutubeId(url);
  if(!id){
    notice("유튜브 주소를 확인해 주세요.");
    return;
  }

  const iframe=$("screenVideo");
  iframe.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
  iframe.style.display="block";
  notice("스크린에서 영상을 재생합니다.");
}

/* 작품 목록 열기 */
$("adminToggle").addEventListener("contextmenu",e=>e.preventDefault());
const filmButton=document.createElement("button");
filmButton.className="small-btn";
filmButton.textContent="상영 작품";
filmButton.style.position="absolute";
filmButton.style.top="12px";
filmButton.style.right="12px";
filmButton.style.zIndex="5";
filmButton.onclick=()=>$("filmsPanel").classList.add("show");
$("game").appendChild(filmButton);

$("closeFilms").onclick=()=>$("filmsPanel").classList.remove("show");

/* 관리자 */
async function checkAdmin(user){
  if(!user){isAdmin=false;return false;}
  const {data,error}=await supabase.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error){console.error(error);isAdmin=false;return false;}
  isAdmin=!!data;
  return isAdmin;
}

$("adminToggle").onclick=()=>{
  if(isAdmin)$("adminBox").classList.toggle("show");
  else $("loginBox").classList.toggle("show");
};

$("loginBtn").onclick=async()=>{
  const {data,error}=await supabase.auth.signInWithPassword({
    email:$("adminEmail").value.trim(),
    password:$("adminPassword").value
  });
  if(error){notice("로그인 정보를 확인해 주세요.");return;}
  currentUser=data.user;
  if(!await checkAdmin(currentUser)){
    await supabase.auth.signOut();
    currentUser=null;
    notice("관리자 권한이 없는 계정이에요.");
    return;
  }
  $("loginBox").classList.remove("show");
  $("adminBox").classList.add("show");
  $("adminToggle").textContent="관리자 페이지";
  renderFilms();
  notice("관리자로 로그인했어요.");
};

$("logoutBtn").onclick=async()=>{
  await supabase.auth.signOut();
  currentUser=null;
  isAdmin=false;
  $("adminBox").classList.remove("show");
  $("adminToggle").textContent="관리자";
  renderFilms();
};

supabase.auth.onAuthStateChange(async(_event,session)=>{
  currentUser=session?.user||null;
  if(currentUser&&await checkAdmin(currentUser)){
    $("adminToggle").textContent="관리자 페이지";
    $("adminBox").classList.add("show");
  }else{
    isAdmin=false;
    $("adminToggle").textContent="관리자";
    $("adminBox").classList.remove("show");
  }
  renderFilms();
});

$("addFilm").onclick=async()=>{
  if(!isAdmin||!currentUser){notice("관리자 로그인이 필요해요.");return;}
  const title=$("filmTitle").value.trim();
  const video_url=$("filmUrl").value.trim();
  if(!title||!video_url){notice("제목과 영상 주소를 입력해 주세요.");return;}

  const {error}=await supabase.from("films").insert({
    title,
    type:$("filmType").value,
    video_url,
    poster_url:$("posterUrl").value.trim()||null,
    description:$("filmDescription").value.trim()||null
  });

  if(error){console.error(error);notice("등록에 실패했어요.");return;}
  $("filmTitle").value="";
  $("filmUrl").value="";
  $("posterUrl").value="";
  $("filmDescription").value="";
  await loadFilms();
  notice("작품을 등록했어요.");
};

async function deleteFilm(id){
  if(!isAdmin||!confirm("이 작품을 삭제할까요?"))return;
  const {error}=await supabase.from("films").delete().eq("id",id);
  if(error){notice("삭제에 실패했어요.");return;}
  await loadFilms();
  notice("삭제했어요.");
}

supabase.channel("nyajju-film-updates")
  .on("postgres_changes",{event:"*",schema:"public",table:"films"},loadFilms)
  .subscribe();

/* 실행 */
async function init(){
  try{
    createWorld();
    await loadFilms();
    await startRealtime();
  }catch(error){
    console.error(error);
    notice("영화관을 불러오지 못했어요. 새로고침해 주세요.");
  }
}
init();
</script>
