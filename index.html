
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노유나</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #29251f;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.notebook {
  position: relative;
  width: min(100vw, 928px);
  height: auto;
  line-height: 0;
  box-shadow: 0 8px 35px #0007;
}

.notebook img {
  display: block;
  width: 100%;
  height: auto;
}

.writing {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  width: max-content;
  white-space: nowrap;
  line-height: 1.3;

  font-family: 'Noto Serif KR', serif;
  font-size: clamp(65px, 15vw, 145px);
  font-weight: 500;
  letter-spacing: 2px;

  color: rgba(255, 218, 35, 0.78);

  clip-path: inset(0 100% 0 0);
  animation: write 2.4s linear forwards;
}

@keyframes write {
  from {
    clip-path: inset(0 100% 0 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

button {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  border: none;
  border-radius: 30px;
  padding: 12px 23px;
  background: #f3d84c;
  color: #40391f;
  font-size: 14px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="notebook">
  <img src="IMG_1860.jpeg" alt="공책">
  <div class="writing" id="writing">노유나</div>
</div>

<button onclick="replay()">다시 쓰기</button>

<script>
function replay() {
  const writing = document.getElementById("writing");

  writing.style.animation = "none";
  void writing.offsetWidth;
  writing.style.animation = "write 2.4s linear forwards";
}
</script>

</body>
</html>
